# Super is cmd (VIA puts it where cmd sits on a Mac). Linux apps use ctrl for those shortcuts,
# so outside ghostty super+<key> is sent as ctrl+<key>. Ghostty binds super itself (ghostty/config).
# Not remapped: super+space (ulauncher), super+q/enter/tab/shift+s (Cinnamon, cinnamon.sh), alt
# beyond the word keys below (cortile). Installed and started by
# external/xremap.sh; xremap reloads it on in-place saves, but an editor that replaces the file
# needs xremap restarted.
default_mode: default
keymap:
  # Service mode, like aerospace's alt-shift-; (Cinnamon has no binding modes, so xremap holds
  # it). Keymaps without a mode apply in both; keys not listed here pass through while in it.
  # Window moves themselves are cortile actions (cortile/retile.sh).
  - name: enter service mode
    mode: default
    remap:
      Alt-Shift-semicolon: { set_mode: service }
  - name: service mode
    mode: service
    remap:
      Esc: { set_mode: default }
      r: [{ launch: ["sh", "-c", "$HOME/.config/cortile/retile.sh reset"] }, { set_mode: default }]
      Alt-Shift-h: [{ launch: ["sh", "-c", "$HOME/.config/cortile/retile.sh left"] }, { set_mode: default }]
      Alt-Shift-j: [{ launch: ["sh", "-c", "$HOME/.config/cortile/retile.sh down"] }, { set_mode: default }]
      Alt-Shift-k: [{ launch: ["sh", "-c", "$HOME/.config/cortile/retile.sh up"] }, { set_mode: default }]
      Alt-Shift-l: [{ launch: ["sh", "-c", "$HOME/.config/cortile/retile.sh right"] }, { set_mode: default }]

  # alt+shift+d is Discord (focus-app, cinnamon.sh), super+shift+s the area screenshot and
  # ctrl+alt(+shift)+arrows Cinnamon's workspace keys. xremap matches with extra modifiers held, so
  # Alt-d, Super-s and Alt-Left/Right below would eat them; the first keymap that matches wins, so
  # pass them through.
  - name: cinnamon keys
    remap:
      Alt-Shift-d: Alt-Shift-d
      Super-Shift-s: Super-Shift-s
      C-Alt-Left: C-Alt-Left
      C-Alt-Right: C-Alt-Right
      C-Alt-Shift-Left: C-Alt-Shift-Left
      C-Alt-Shift-Right: C-Alt-Shift-Right

  # Mac line and word keys, everywhere but ghostty (the shell already does these). Safe because the
  # apps' own ctrl+a/e/k (select all, ...) are reached with super, which is sent as ctrl below and
  # xremap doesn't remap its own output.
  - name: mac line keys
    application:
      not: [/ghostty/]
    remap:
      C-a: Home
      C-e: End
      C-f: Right
      C-b: Left
      C-n: Down
      C-p: Up
      # delete the char after the cursor
      C-d: Delete
      # kill to end of line (at the end it deletes the newline, like the Mac)
      C-k: [Shift-End, Delete]
      # word keys like option on the Mac (alt = option, see the header)
      Alt-f: C-Right
      Alt-b: C-Left
      # and option+arrows (otherwise back/forward in browsers, which is super+[ and ] here)
      Alt-Right: C-Right
      Alt-Left: C-Left
      Alt-d: C-Delete
      Alt-Backspace: C-Backspace

  - name: super as cmd
    application:
      # X11 app names are "instance.class" (ghostty.com.mitchellh.ghostty), so match by regex
      not: [/ghostty/]
    remap:
      # edit
      Super-a: C-a
      Super-c: C-c
      Super-v: C-v
      Super-Shift-v: C-Shift-v
      Super-x: C-x
      Super-z: C-z
      Super-Shift-z: C-Shift-z
      Super-e: C-e
      Super-f: C-f
      Super-g: C-g
      Super-Shift-g: C-Shift-g
      Super-b: C-b
      Super-i: C-i
      Super-u: C-u
      Super-k: C-k
      # files
      Super-s: C-s
      # super+shift+s isn't save-as, it's passed through to Cinnamon (cinnamon keys, above)
      Super-o: C-o
      Super-p: C-p
      # tabs and windows
      Super-t: C-t
      Super-Shift-t: C-Shift-t
      Super-w: C-w
      Super-Shift-w: C-Shift-w
      Super-n: C-n
      Super-Shift-n: C-Shift-n
      Super-r: C-r
      Super-Shift-r: C-Shift-r
      Super-l: C-l
      Super-d: C-d
      Super-Shift-leftbrace: C-pageup
      Super-Shift-rightbrace: C-pagedown
      Super-leftbrace: Alt-left
      Super-rightbrace: Alt-right
      # line and input ends like cmd+arrows; with shift they select (Cinnamon's tiling on these is
      # cleared in cinnamon.sh)
      Super-Left: Home
      Super-Right: End
      Super-Up: C-Home
      Super-Down: C-End
      Super-1: C-1
      Super-2: C-2
      Super-3: C-3
      Super-4: C-4
      Super-5: C-5
      Super-6: C-6
      Super-7: C-7
      Super-8: C-8
      Super-9: C-9
      # zoom
      Super-equal: C-equal
      Super-minus: C-minus
      Super-0: C-0
